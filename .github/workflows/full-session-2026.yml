name: Full-session operational test (2026)

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/full-session-2026.yml'
      - 'analyze/**'
      - 'tools/acquire_session_chapters.py'
      - 'tools/summarize_session_run.py'
      - 'tools/validate_operational_certification.py'
      - 'tools/test_validate_operational_certification.py'
      - 'operations/certification-matrix.json'
      - 'operations/2026-session-plan.json'
      - 'operations/reviews/2026-*'
      - 'ors/tools/reconcile_pending_changes.py'
      - 'ors/tools/resolve_general_notices.py'
      - 'ors/reviews/2026-amendment-table*.json'
      - 'ors/tools/verify_amendment_references.py'
      - 'ors/tests/test_verify_amendment_references.py'
      - 'ors/tools/build_amendment_preview.py'
      - 'ors/tests/test_build_amendment_preview.py'
      - 'ors/tools/build_preview_batch.py'
      - 'ors/tests/test_build_preview_batch.py'
      - 'ors/tools/build_preview_catalog.py'
      - 'ors/tests/test_build_preview_catalog.py'
      - 'ors/reviews/amendment-previews/**'
  workflow_dispatch:

concurrency:
  group: full-session-2026-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  session-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.5'
          enable-stack: true
          stack-version: 'latest'

      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            analyze/.stack-work
          key: ${{ runner.os }}-stack-${{ hashFiles('analyze/stack.yaml.lock', 'analyze/analyze.cabal') }}
          restore-keys: |
            ${{ runner.os }}-stack-

      - name: Build executable
        working-directory: analyze
        run: stack build --no-terminal

      - name: Acquire 2026 Oregon Laws chapters 1-142
        shell: bash
        run: |
          set -o pipefail
          python3 tools/acquire_session_chapters.py \
            --year 2026 \
            --first-chapter 1 \
            --last-chapter 142 \
            --output-dir session-fixtures \
            --report session-acquisition-report.json \
            --workers 10 \
            --retries 3 \
            --timeout 60 || true
          jq -e '.schemaVersion == 1 and .expectedDocuments == 142' session-acquisition-report.json >/dev/null

      - name: Parse complete acquired session
        working-directory: analyze
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../session-results
          : > ../session-parser-exit-codes.tsv
          parse_one() {
            local padded="$1"
            local id="2026orlaw${padded}"
            local fixture="../session-fixtures/${id}.pdf"
            local source_url
            if [[ ! -f "$fixture" ]]; then
              printf '%s\t%s\n' "$id" "source-missing" >> ../session-parser-exit-codes.tsv
              return 0
            fi
            source_url="$(jq -er --arg id "$id" '.documents[] | select(.id == $id and .ok == true) | .sourceUrl' ../session-acquisition-report.json)" || return 1
            set +e
            timeout 120s stack exec -- analyze "$fixture" --tika-jar ../tika-app-2.8.0.jar --source-url "$source_url" > "../session-results/${id}.json"
            code=$?
            set -e
            printf '%s\t%s\n' "$id" "$code" >> ../session-parser-exit-codes.tsv
            return 0
          }
          export -f parse_one
          seq -w 0001 0142 | xargs -P 4 -I{} bash -c 'parse_one "$1"' _ {}
          test "$(wc -l < ../session-parser-exit-codes.tsv)" -eq 142

      - name: Summarize operational run
        id: summarize
        shell: bash
        run: |
          set +e
          python3 tools/summarize_session_run.py \
            --year 2026 \
            --first-chapter 1 \
            --last-chapter 142 \
            --acquisition-report session-acquisition-report.json \
            --results-dir session-results \
            --report session-operational-report.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Reconcile source-pinned ORS pending notices
        run: |
          python3 ors/tools/reconcile_pending_changes.py \
            --pending operations/reviews/2026-ors-pending-changes.ndjson \
            --session-results-dir session-results \
            --report session-2026-ors-reconciliation.json
          jq '{pendingChangeCount, chapterSpecificNoticeCount, nonSpecificNoticeCount, matchedParsedCount, matchedParserErrorCount, missingSessionResultCount, allChapterSpecificNoticesResolved}' session-2026-ors-reconciliation.json
          jq -e '.pendingChangeCount == 10 and .matchedParsedCount == 8 and .nonSpecificNoticeCount == 2 and .allChapterSpecificNoticesResolved == true' session-2026-ors-reconciliation.json >/dev/null

      - name: Resolve general ORS notices through reviewed amendment table
        run: |
          python3 ors/tools/resolve_general_notices.py \
            --pending operations/reviews/2026-ors-pending-changes.ndjson \
            --review ors/reviews/2026-amendment-table.json \
            --session-results-dir session-results \
            --report session-2026-general-notices.json
          jq '{generalNoticeCount, resolvedNoticeCount, unresolvedNoticeCount, matchedReferenceCount}' session-2026-general-notices.json
          jq -e '.generalNoticeCount == 2 and .resolvedNoticeCount == 2 and .unresolvedNoticeCount == 0 and .matchedReferenceCount == 7' session-2026-general-notices.json >/dev/null

      - name: Verify reviewed section-level amendment references
        run: |
          python3 ors/tools/verify_amendment_references.py \
            --review ors/reviews/2026-amendment-table.json \
            --review ors/reviews/2026-amendment-table-expansion.json \
            --review ors/reviews/2026-amendment-table-chain.json \
            --results-dir session-results \
            --acquisition-report session-acquisition-report.json \
            --report session-2026-section-verification.json
          jq -e '.gatePassed == true and .referenceCount == 13 and .exactMatchCount == 13' session-2026-section-verification.json >/dev/null

      - name: Build reviewed ORS 471.810 amendment preview
        run: |
          python3 ors/tools/build_amendment_preview.py \
            --base ors/reviews/amendment-previews/471810-base.json \
            --plan ors/reviews/amendment-previews/2026-c44-s19.json \
            --verification session-2026-section-verification.json \
            --as-of 2026-06-05 \
            --report session-2026-amendment-preview.json \
            --markdown session-2026-amendment-preview.md
          jq -c '{amendmentPreview: .}' session-2026-amendment-preview.json

      - name: Build ordered reviewed amendment previews
        run: |
          python3 ors/tools/build_preview_batch.py \
            --manifest ors/reviews/amendment-previews/batch.json \
            --verification session-2026-section-verification.json \
            --as-of 2026-06-05 \
            --output-dir session-2026-preview-batch
          jq -e '.planCount == 2 and .previewCount == 2 and .pendingCount == 0' session-2026-preview-batch/batch.json >/dev/null

      - name: Verify real successive amendments at operative date boundaries
        run: |
          for boundary in 2026-03-30:0 2026-03-31:1 2027-06-30:1 2027-07-01:2; do
            day="${boundary%:*}"
            count="${boundary#*:}"
            python3 ors/tools/build_preview_batch.py \
              --manifest ors/reviews/amendment-previews/696370-chain.json \
              --verification session-2026-section-verification.json \
              --as-of "$day" \
              --output-dir "session-2026-real-chain/$day"
            jq -e --argjson count "$count" '.planCount == 2 and .previewCount == $count and .pendingCount == (2 - $count)' "session-2026-real-chain/$day/batch.json" >/dev/null
          done
          jq -e '.previews[1].beforeBodyText == .previews[0].proposedBodyText and .previews[1].predecessorPreviewId == .previews[0].previewId and .currentPreviewBySection["2025-696.370"] == .previews[1].previewId' session-2026-real-chain/2027-07-01/batch.json >/dev/null

      - name: Publish reviewed preview collection and explicit coverage gaps
        run: |
          for boundary in 2026-04-06:1 2026-04-07:6 2026-06-04:6 2026-06-05:8 2026-09-09:8 2026-12-31:8 2027-01-01:12 2027-07-01:13; do
            day="${boundary%:*}"
            count="${boundary#*:}"
            python3 ors/tools/build_preview_catalog.py \
              --manifest ors/reviews/amendment-previews/catalog.json \
              --verification session-2026-section-verification.json \
              --as-of "$day" \
              --output-dir "session-2026-preview-catalog/$day"
            jq -e --argjson count "$count" '.verifiedReferenceCount == 13 and .plannedReferenceCount == 13 and .referencesNeedingTextReview == 0 and .allReviewedReferencesHavePlans == true and .appliedPreviewCount == $count and .scheduledPreviewCount == (13 - $count)' "session-2026-preview-catalog/$day/catalog.json" >/dev/null
          done

      - name: Upload ORS reconciliation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-2026-ors-reconciliation
          path: |
            session-2026-ors-reconciliation.json
            session-2026-general-notices.json
            session-2026-section-verification.json
            session-2026-amendment-preview.json
            session-2026-amendment-preview.md
            session-2026-preview-batch/
            session-2026-real-chain/
            session-2026-preview-catalog/
          if-no-files-found: error
          retention-days: 90

      - name: Upload session acquisition report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-2026-acquisition
          path: session-acquisition-report.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload session parser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-2026-parser-results
          path: |
            session-results/*.json
            session-parser-exit-codes.tsv
          if-no-files-found: warn
          retention-days: 90

      - name: Upload operational summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-2026-operational-report
          path: session-operational-report.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce operational hard gate
        if: always()
        shell: bash
        run: |
          test -f session-operational-report.json
          jq -e '.operationalGatePassed == true and .expectedDocuments == 142 and .acquiredDocuments == 142 and .parsedDocuments == 142' session-operational-report.json >/dev/null
