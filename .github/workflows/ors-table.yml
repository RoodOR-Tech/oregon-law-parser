name: ORS relational table

# Parallel to the session-law amendment pipeline. This workflow only exercises
# the ORS effort under ors/ and never touches the frozen gold or unseen
# validation corpora owned by the amendment parser.

on:
  push:
    branches:
      - master
    paths:
      - 'ors/**'
      - '.github/workflows/ors-table.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'ors/**'
      - '.github/workflows/ors-table.yml'
  workflow_dispatch:
    inputs:
      scope:
        description: 'Which chapters to acquire and probe'
        required: true
        type: choice
        default: sample
        options:
          - sample
          - whole-edition
      chapters:
        description: 'Override with specific chapters, e.g. 1,161,279A (ignored unless scope is sample)'
        required: false
        default: ''

concurrency:
  group: ors-table-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Offline unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run ORS tool tests
        run: python3 -m unittest discover -s ors/tests -v

  discover-and-probe:
    name: Discover the edition and probe chapter structure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: offline-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Discovery and acquisition are diagnosed independently, and the gate on
      # discovery runs last. A discovery failure and a chapter-URL failure have
      # different causes and different fixes, so one run should distinguish
      # them rather than stopping at whichever fails first.
      - name: Discover the published chapter roster
        id: discover
        continue-on-error: true
        run: |
          set -uo pipefail
          python3 ors/tools/acquire_ors_chapters.py \
            --index-only \
            --report ors-chapter-index.json

      # Routine runs acquire only the fixed development sample in
      # ors/sample/chapters.json, so a cycle stays to a handful of requests.
      # A whole-edition run is several hundred requests and is opt-in.
      - name: Acquire chapter sources
        env:
          SCOPE: ${{ github.event.inputs.scope || 'sample' }}
          CHAPTER_OVERRIDE: ${{ github.event.inputs.chapters }}
        run: |
          set -euo pipefail
          if [ "$SCOPE" = "whole-edition" ]; then
            echo "Acquiring the whole edition."
            python3 ors/tools/acquire_ors_chapters.py \
              --output-dir ors-sources \
              --report ors-acquisition.json
          elif [ -n "$CHAPTER_OVERRIDE" ]; then
            echo "Acquiring overridden chapters: $CHAPTER_OVERRIDE"
            python3 ors/tools/acquire_ors_chapters.py \
              --chapters "$CHAPTER_OVERRIDE" \
              --output-dir ors-sources \
              --report ors-acquisition.json
          else
            echo "Acquiring the fixed development sample."
            python3 ors/tools/acquire_ors_chapters.py \
              --chapters-file ors/sample/chapters.json \
              --output-dir ors-sources \
              --report ors-acquisition.json
          fi
          jq -e '.valid == true and ([.chapters[] | select(.ok) | .sha256] | all(test("^[0-9a-f]{64}$")))' ors-acquisition.json >/dev/null
        # Acquisition normally reads chapter URLs from the roster. When
        # discovery failed there is no roster, so fall back to constructing
        # URLs from the explicitly named sample. That run is marked
        # rosterVerified false and only exists to isolate the failure.
        if: steps.discover.outcome == 'success'

      - name: Acquire sample chapters without the index
        if: steps.discover.outcome != 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 ors/tools/acquire_ors_chapters.py \
            --without-index \
            --chapters-file ors/sample/chapters.json \
            --output-dir ors-sources \
            --report ors-acquisition.json
          jq -e '([.chapters[] | select(.ok) | .sha256] | all(test("^[0-9a-f]{64}$")))' ors-acquisition.json >/dev/null

      - name: Probe chapter structure
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          if [ ! -f ors-acquisition.json ]; then
            echo "No acquisition report to probe."
            exit 1
          fi
          python3 ors/tools/probe_ors_structure.py \
            --acquisition-report ors-acquisition.json \
            --report ors-structure-probe.json

      # Counters for every chapter, deep samples for one. The whole-chapter
      # dump is what pushed the index diagnostics out of the readable tail.
      - name: Print the structural fingerprint
        if: always()
        run: |
          set -uo pipefail
          if [ ! -f ors-structure-probe.json ]; then
            echo "No structure probe report was written."
            exit 0
          fi
          echo "Per-chapter counters:"
          jq -r '["chapter","enc","bytes","lines","sectNums","lineAnchors","boldAnchors","ambiguous","credits","stubs"],
                 (.chapters[] | [
                   .chapterNumber, .sourceEncoding, .bytes, .visibleLineCount,
                   .distinctSectionNumbers, .sectionAnchorLineCount,
                   .boldSectionAnchorCount, .ambiguousSectionLineCount,
                   .sourceCreditMatches, .repealStubMatches
                 ]) | @tsv' ors-structure-probe.json | column -t
          echo
          echo "Unreadable chapters:"
          jq -c '.unreadable' ors-structure-probe.json
          echo
          echo "Deep sample (first chapter):"
          jq '.chapters[0] | {
            chapterNumber, sourceUrl, sourceEncoding, declaredCharset,
            tagHistogram: .tagHistogram[0:6],
            classHistogram: .classHistogram[0:6],
            sampleBoldSectionAnchors, sampleAmbiguousSectionLines,
            sampleSourceCredits: .sampleSourceCredits[0:5],
            sampleLines: .sampleLines[0:20]
          }' ors-structure-probe.json

      # Printed immediately before the gate so it stays in the readable tail
      # of the log on a failing run.
      - name: Print the discovered edition and chapter roster
        if: always()
        run: |
          set -uo pipefail
          if [ ! -f ors-chapter-index.json ]; then
            echo "No index report was written."
            exit 0
          fi
          echo "Valid: $(jq -r '.valid' ors-chapter-index.json)"
          echo "Edition year: $(jq -r '.editionYear // "unknown"' ors-chapter-index.json)"
          echo "Index SHA-256: $(jq -r '.indexSha256 // "none"' ors-chapter-index.json)"
          echo "Chapters discovered: $(jq -r '.discoveredChapterCount // 0' ors-chapter-index.json)"
          if [ "$(jq -r '.valid' ors-chapter-index.json)" = "true" ]; then
            echo "Roster:"
            jq -r '[.chapters[].chapterNumber] | join(" ")' ors-chapter-index.json
          else
            echo "Problems: $(jq -c '.problems' ors-chapter-index.json)"
            jq -r '.indexDiagnostics
              | "title: \(.pageTitle)  anchors: \(.anchorCount)  scripts: \(.scriptCount)  hrefs: \(.hrefCount)"' \
              ors-chapter-index.json
            echo "Href path prefixes (count, prefix, extensions):"
            jq -r '.indexDiagnostics.hrefPathPrefixHistogram[]
              | "\(.count)\t\(.prefix)\t\([.extensions[] | "\(.extension):\(.count)"] | join(","))"' \
              ors-chapter-index.json | column -t
            echo
            echo "Largest prefix: $(jq -r '.indexDiagnostics.topPrefix' ors-chapter-index.json)"
            echo "Every basename under it:"
            jq -r '.indexDiagnostics.topPrefixBasenames | join(" ")' ors-chapter-index.json | fold -s -w 160
          fi

      # The real gate. It runs last so the diagnostic steps above have already
      # printed their evidence into the log even on a failing run.
      - name: Gate on chapter discovery, acquisition and probe
        if: always()
        run: |
          set -euo pipefail
          jq -e '.valid == true and .schemaVersion == 1 and .discoveredChapterCount > 0' ors-chapter-index.json >/dev/null
          jq -e '.valid == true and ([.chapters[] | select(.ok) | .sha256] | all(test("^[0-9a-f]{64}$")))' ors-acquisition.json >/dev/null
          jq -e '.valid == true and .probedChapterCount > 0' ors-structure-probe.json >/dev/null

      - name: Upload ORS pipeline reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ors-pipeline-reports
          path: |
            ors-chapter-index.json
            ors-acquisition.json
            ors-structure-probe.json
          if-no-files-found: warn
          retention-days: 30
