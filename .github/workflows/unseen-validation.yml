name: Unseen validation evaluation

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: unseen-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analyze
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build frozen validation manifest
        run: |
          set -euo pipefail
          python3 ../tools/build_unseen_validation_manifest.py \
            --selection ../validation/pending/unseen-25-candidates.json \
            --hashes ../validation/reviews/unseen-25-source-hashes.json \
            --reviews \
              ../validation/reviews/batch1-2005-expectations.json \
              ../validation/reviews/batch2-2007-expectations.json \
              ../validation/reviews/batch3-2011-expectations.json \
              ../validation/reviews/batch4-2021-2023-expectations.json \
            --quality-targets-from ../gold/manifest.json \
            --output ../validation-manifest.json
          jq -e '.corpusType == "unseen-validation" and (.documents | length == 25) and ([.documents[].reviewStatus == "independently-reviewed"] | all)' ../validation-manifest.json >/dev/null

      - name: Acquire pinned unseen fixtures
        run: |
          set -euo pipefail
          python3 ../tools/acquire_gold_fixtures.py \
            --manifest ../validation-manifest.json \
            --repo-root .. \
            --report ../validation-fixture-acquisition.json
          jq -e '.valid == true and (.documents | length == 25) and ([.documents[].hashPinned] | all)' ../validation-fixture-acquisition.json >/dev/null

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.5'
          enable-stack: true
          stack-version: 'latest'

      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            analyze/.stack-work
          key: ${{ runner.os }}-stack-${{ hashFiles('analyze/stack.yaml.lock', 'analyze/analyze.cabal') }}
          restore-keys: |
            ${{ runner.os }}-stack-

      - name: Build executable
        run: stack build --no-terminal

      - name: Run parser on unseen corpus
        run: |
          set -euo pipefail
          mkdir -p ../validation-results
          while IFS=$'\t' read -r id fixture source_url; do
            if ! stack exec -- analyze "../$fixture" --tika-jar ../tika-app-2.8.0.jar --source-url "$source_url" > "../validation-results/$id.json"; then
              echo "Parser returned structured failure for $id" >&2
            fi
          done < <(jq -r '.documents[] | [.id, .fixture, .sourceUrl] | @tsv' ../validation-manifest.json)

      - name: Evaluate unseen corpus
        run: |
          set -euo pipefail
          python3 ../tools/evaluate_unseen_validation.py \
            --manifest ../validation-manifest.json \
            --results-dir ../validation-results \
            --report ../unseen-validation-report.json

      - name: Upload validation manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unseen-validation-manifest
          path: validation-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload fixture acquisition report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unseen-validation-acquisition
          path: validation-fixture-acquisition.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload unseen parser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unseen-validation-results
          path: validation-results/*.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload unseen validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unseen-validation-report
          path: unseen-validation-report.json
          if-no-files-found: warn
          retention-days: 90

  full-session-2023-hard-gate:
    if: github.event_name == 'pull_request' && github.head_ref == 'operations/full-session-2023'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.5'
          enable-stack: true
          stack-version: 'latest'

      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            analyze/.stack-work
          key: ${{ runner.os }}-stack-${{ hashFiles('analyze/stack.yaml.lock', 'analyze/analyze.cabal') }}
          restore-keys: |
            ${{ runner.os }}-stack-

      - name: Build executable
        working-directory: analyze
        run: stack build --no-terminal

      - name: Acquire 2023 Oregon Laws chapters 1-615
        shell: bash
        run: |
          set -o pipefail
          python3 tools/acquire_session_chapters.py \
            --year 2023 \
            --first-chapter 1 \
            --last-chapter 615 \
            --output-dir session-fixtures \
            --report session-acquisition-report.json \
            --workers 10 \
            --retries 3 \
            --timeout 60 || true
          jq -e '.schemaVersion == 1 and .expectedDocuments == 615' session-acquisition-report.json >/dev/null

      - name: Parse complete acquired session
        working-directory: analyze
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../session-results
          : > ../session-parser-exit-codes.tsv
          parse_one() {
            local padded="$1"
            local id="2023orlaw${padded}"
            local fixture="../session-fixtures/${id}.pdf"
            local source_url="https://www.oregonlegislature.gov/bills_laws/lawsstatutes/${id}.pdf"
            if [[ ! -f "$fixture" ]]; then
              printf '%s\t%s\n' "$id" "source-missing" >> ../session-parser-exit-codes.tsv
              return 0
            fi
            set +e
            timeout 120s stack exec -- analyze "$fixture" --tika-jar ../tika-app-2.8.0.jar --source-url "$source_url" > "../session-results/${id}.json"
            code=$?
            set -e
            printf '%s\t%s\n' "$id" "$code" >> ../session-parser-exit-codes.tsv
            return 0
          }
          export -f parse_one
          seq -w 0001 0615 | xargs -P 4 -I{} bash -c 'parse_one "$1"' _ {}
          test "$(wc -l < ../session-parser-exit-codes.tsv)" -eq 615

      - name: Summarize operational run
        shell: bash
        run: |
          set +e
          python3 tools/summarize_session_run.py \
            --year 2023 \
            --first-chapter 1 \
            --last-chapter 615 \
            --acquisition-report session-acquisition-report.json \
            --results-dir session-results \
            --report session-operational-report.json
          exit 0

      - name: Upload session acquisition report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-2023-acquisition
          path: session-acquisition-report.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload session parser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-2023-parser-results
          path: |
            session-results/*.json
            session-parser-exit-codes.tsv
          if-no-files-found: warn
          retention-days: 90

      - name: Upload operational summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-2023-operational-report
          path: session-operational-report.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce operational hard gate
        if: always()
        shell: bash
        run: |
          test -f session-operational-report.json
          jq -e '.operationalGatePassed == true and .expectedDocuments == 615 and .acquiredDocuments == 615 and .parsedDocuments == 615' session-operational-report.json >/dev/null
