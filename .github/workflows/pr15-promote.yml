name: Promote PR15 verified gold candidates

on:
  push:
    branches:
      - hardening/pr15-2010-special-session
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote staged candidates with verified hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path('gold/manifest.json')
          pending_path = Path('gold/pending/pr15-candidates.json')
          workflow_path = Path('.github/workflows/pr15-promote.yml')

          if not pending_path.exists():
              raise SystemExit('PR15 pending file is missing; refusing promotion')

          hashes = {
              '2010orlaw0023': ('https://olis.oregonlegislature.gov/liz/2010S1/Downloads/MeasureDocument/SB993/Enrolled', 'bc883632be94eb200d8a9d5f9792a0234eaaff6b08d37d837987770c36e98894'),
              '2010orlaw0050': ('https://olis.oregonlegislature.gov/liz/2010S1/Downloads/MeasureDocument/HB3668/Enrolled', '6126f962e35a5b12c71d7a4f83011296ad2043d2dda4a80d5c944b1d8ceefe4e'),
              '2010orlaw0083': ('https://olis.oregonlegislature.gov/liz/2010S1/Downloads/MeasureDocument/SB1025/Enrolled', 'ccfa9954807f0b39c2272502980bfeee2f5f31990d60fb0c059dee592173281b'),
              '2010orlaw0091': ('https://olis.oregonlegislature.gov/liz/2010S1/Downloads/MeasureDocument/HB3663/Enrolled', 'bdca0681554e9ad443f4052ae597e351459aa0b28c1576cb17a73cc226ee0689'),
          }

          manifest = json.loads(manifest_path.read_text())
          pending = json.loads(pending_path.read_text())
          docs = manifest['documents']
          existing = {d['id'] for d in docs}
          if len(docs) != 38:
              raise SystemExit(f'Expected 38 existing gold documents, found {len(docs)}')

          promoted = []
          for doc in pending['documents']:
              doc_id = doc['id']
              if doc_id not in hashes:
                  raise SystemExit(f'Unexpected candidate {doc_id}')
              if doc_id in existing:
                  raise SystemExit(f'Candidate already exists in manifest: {doc_id}')
              expected_url, sha = hashes[doc_id]
              if doc['sourceUrl'] != expected_url:
                  raise SystemExit(f'Source URL mismatch for {doc_id}')
              out = dict(doc)
              out['sourceSha256'] = sha
              out['reviewStatus'] = 'independently-reviewed'
              promoted.append(out)

          if {d['id'] for d in promoted} != set(hashes):
              raise SystemExit('Candidate set does not exactly match verified staging report')

          docs.extend(promoted)
          ids = [d['id'] for d in docs]
          if len(ids) != 42 or len(ids) != len(set(ids)):
              raise SystemExit('Post-promotion manifest cardinality/uniqueness check failed')

          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')
          pending_path.unlink()
          workflow_path.unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold/manifest.json gold/pending/pr15-candidates.json .github/workflows/pr15-promote.yml
          git commit -m 'gold: promote verified 2010 special-session cases'
          git push
