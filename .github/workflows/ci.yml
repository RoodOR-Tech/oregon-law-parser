name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analyze
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.5'
          enable-stack: true
          stack-version: 'latest'

      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            analyze/.stack-work
          key: ${{ runner.os }}-stack-${{ hashFiles('analyze/stack.yaml.lock', 'analyze/analyze.cabal') }}
          restore-keys: |
            ${{ runner.os }}-stack-

      - name: Build and run unit tests
        run: |
          set -o pipefail
          stack test --no-terminal 2>&1 | tee stack-test.log

      - name: Test review tooling
        run: python3 ../tools/test_build_conflict_report.py -v

      - name: Upload unit-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stack-test-log
          path: analyze/stack-test.log
          if-no-files-found: error
          retention-days: 7

      - name: Build executable
        run: stack build --no-terminal

      - name: Smoke-test bundled PDF fixtures
        run: |
          set -euo pipefail
          for fixture in ../fixtures/2022orlaw0001.pdf ../fixtures/2022orlaw0002.pdf; do
            out="$(mktemp)"
            stack exec -- analyze "$fixture" --tika-jar ../tika-app-2.8.0.jar > "$out"
            jq -e '.year and .chapter and .bill and .affectedSections and .validation and .provenance' "$out" >/dev/null
            jq -e '.validation.validationStatus | IN("Verified", "ParsedUnverified", "Conflict", "Incomplete")' "$out" >/dev/null
            jq -e '.provenance.sourceSha256 | test("^[0-9a-f]{64}$")' "$out" >/dev/null
            jq -e '.provenance.sourcePath | length > 0' "$out" >/dev/null
          done

      - name: Validate gold corpus review metadata
        run: |
          set -euo pipefail
          python3 ../tools/validate_gold_manifest.py \
            --manifest ../gold/manifest.json \
            --repo-root .. | tee ../gold-manifest-validation.json

      - name: Evaluate gold-standard corpus
        run: |
          set -euo pipefail
          mkdir -p ../gold-results
          while IFS=$'\t' read -r id fixture source_url; do
            stack exec -- analyze "../$fixture" --tika-jar ../tika-app-2.8.0.jar --source-url "$source_url" > "../gold-results/$id.json"
          done < <(jq -r '.documents[] | [.id, .fixture, .sourceUrl] | @tsv' ../gold/manifest.json)
          python3 ../tools/evaluate_gold.py \
            --manifest ../gold/manifest.json \
            --results-dir ../gold-results \
            --report ../gold-quality-report.json

      - name: Build conflict review report
        if: always()
        run: |
          set -euo pipefail
          if [[ -f ../gold-quality-report.json && -d ../gold-results ]]; then
            python3 ../tools/build_conflict_report.py \
              --manifest ../gold/manifest.json \
              --results-dir ../gold-results \
              --quality-report ../gold-quality-report.json \
              --lc-csv ../data/legislative-counsel/2026-sample.csv \
              --report ../conflict-review-report.json
            jq -e '.schemaVersion == 1 and (.reviewCaseCount >= 0) and (.cases | type == "array")' ../conflict-review-report.json >/dev/null
          fi

      - name: Upload gold validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-manifest-validation
          path: gold-manifest-validation.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload gold quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-quality-report
          path: gold-quality-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload conflict review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conflict-review-report
          path: conflict-review-report.json
          if-no-files-found: warn
          retention-days: 30
