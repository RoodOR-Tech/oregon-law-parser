name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analyze
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.5'
          enable-stack: true
          stack-version: 'latest'

      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            analyze/.stack-work
          key: ${{ runner.os }}-stack-${{ hashFiles('analyze/stack.yaml.lock', 'analyze/analyze.cabal') }}
          restore-keys: |
            ${{ runner.os }}-stack-

      - name: Build and run unit tests
        run: |
          set -o pipefail
          stack test --no-terminal 2>&1 | tee stack-test.log

      - name: Upload unit-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stack-test-log
          path: analyze/stack-test.log
          if-no-files-found: error
          retention-days: 7

      - name: Build executable
        run: stack build --no-terminal

      - name: Smoke-test bundled PDF fixtures
        run: |
          set -euo pipefail
          for fixture in ../fixtures/2022orlaw0001.pdf ../fixtures/2022orlaw0002.pdf; do
            out="$(mktemp)"
            stack exec -- analyze "$fixture" --tika-jar ../tika-app-2.8.0.jar > "$out"
            jq -e '.year and .chapter and .bill and .affectedSections and .validation' "$out" >/dev/null
            jq -e '.validation.validationStatus | IN("Verified", "ParsedUnverified", "Conflict", "Incomplete")' "$out" >/dev/null
          done
