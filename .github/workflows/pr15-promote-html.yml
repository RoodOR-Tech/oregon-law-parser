name: PR15 promote verified HTML sources

on:
  push:
    branches:
      - hardening/pr15-2010-special-session

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/pr15-2010-special-session
      - name: Promote staged authoritative sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path('gold/manifest.json')
          manifest = json.loads(manifest_path.read_text())
          promoted = {
              '2010orlaw0023': ('https://www.oregonlegislature.gov/bills_laws/lawsstatutes/2010orLaw0023.html', 'gold-fixtures/2010orlaw0023.html', '9cdedbbacade24f22b1076cc9af49e83ac994d907f338c70ccf73fa2ab879e04'),
              '2010orlaw0050': ('https://www.oregonlegislature.gov/bills_laws/lawsstatutes/2010orLaw0050.html', 'gold-fixtures/2010orlaw0050.html', 'fa92a3784bbaeae574fc0118f71eed3e4dd82ff5306b6c974999fb0e0e7447b8'),
              '2010orlaw0083': ('https://www.oregonlegislature.gov/bills_laws/lawsstatutes/2010orLaw0083.html', 'gold-fixtures/2010orlaw0083.html', '357410f86bd31d431ac0f6a9327c712279c78305f7340d9eee34f97c0f10b008'),
              '2010orlaw0091': ('https://www.oregonlegislature.gov/bills_laws/lawsstatutes/2010orLaw0091.html', 'gold-fixtures/2010orlaw0091.html', 'c0bd73e74efcd460a484d4563f6f743b16968bbf16275bf06203d8938462eeba'),
          }
          seen = set()
          for doc in manifest['documents']:
              if doc['id'] not in promoted:
                  continue
              url, fixture, sha = promoted[doc['id']]
              doc['sourceUrl'] = url
              doc['fixture'] = fixture
              doc['sourceSha256'] = sha
              doc['reviewBasis'] = doc['reviewBasis'].replace(
                  'Source staging uses the authoritative OLIS enrolled-bill PDF because per-chapter PDFs are not published for this session; chapter identity and effective date remain independently verified against the official Oregon Laws chapter text.',
                  'The gold fixture uses the authoritative published Oregon Laws chapter HTML because this special session is published as per-chapter HTML rather than per-chapter PDF; the source hash was independently staged and verified before promotion.'
              )
              seen.add(doc['id'])
          missing = set(promoted) - seen
          if missing:
              raise SystemExit(f'missing manifest documents: {sorted(missing)}')
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')

          provenance = {
              'schemaVersion': 1,
              'pullRequest': 15,
              'stagingRun': {
                  'workflow': 'Gold source staging',
                  'runNumber': 37,
                  'runId': 32901952732,
                  'headSha': 'cb2f2b2e2a8ed90c20edfe28ff5a435696c42340',
                  'artifactId': 9583499610,
                  'artifactName': 'gold-source-hashes',
                  'artifactDigest': 'sha256:c885fb94157dd848b423bb455cc424c9856ff1df78c0c7ec6380a34aa14c98e6',
                  'result': 'success'
              },
              'documents': [
                  {'id': k, 'sourceUrl': v[0], 'sha256': v[2], 'sourceFormat': 'html'}
                  for k, v in promoted.items()
              ]
          }
          Path('gold/reviews/pr15-source-hashes.json').write_text(json.dumps(provenance, indent=2) + '\n')
          Path('gold/pending/pr15-html-source-correction-candidates.json').unlink(missing_ok=True)
          PY
          git diff --check
          git diff --exit-code -- gold/manifest.json gold/reviews/pr15-source-hashes.json gold/pending/pr15-html-source-correction-candidates.json || true
      - name: Commit promotion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold/manifest.json gold/reviews/pr15-source-hashes.json gold/pending/pr15-html-source-correction-candidates.json
          if git diff --cached --quiet; then
            echo 'Nothing to promote.'
            exit 0
          fi
          git commit -m 'gold: promote verified 2010 chapter HTML sources'
          git push origin HEAD:hardening/pr15-2010-special-session
