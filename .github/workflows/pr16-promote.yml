name: Promote PR16 verified gold candidates

on:
  push:
    branches:
      - hardening/pr16-final-eight-2009
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote staged candidates with verified hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path('gold/manifest.json')
          pending_path = Path('gold/pending/pr16-candidates.json')
          workflow_path = Path('.github/workflows/pr16-promote.yml')

          if not pending_path.exists():
              raise SystemExit('PR16 pending file is missing; refusing promotion')

          hashes = {
              '2009orlaw0048': ('https://www.oregonlegislature.gov/bills_laws/lawsstatutes/2009orLaw0048.html', '03831681df2affe457a8002f0dc27a6b4362fccb4410962a86d2066322c2d3d2'),
              '2009orlaw0178': ('https://www.oregonlegislature.gov/bills_laws/lawsstatutes/2009orLaw0178.html', '30afa06a01de6b2029f77250688657f3ebf6f7accc62b6f48460a9f8097bda33'),
              '2009orlaw0403': ('https://www.oregonlegislature.gov/bills_laws/lawsstatutes/2009orLaw0403.html', '993458f6d97ab3f468ce7175cc9072f65ef037520a76a61b4546d5aeb611bb36'),
              '2009orlaw0550': ('https://www.oregonlegislature.gov/bills_laws/lawsstatutes/2009orLaw0550.html', 'a62998803bcea71a7ee87d4da291081b4ba98b0f27ab3ca12dcb31998d65a243'),
              '2009orlaw0604': ('https://www.oregonlegislature.gov/bills_laws/lawsstatutes/2009orLaw0604.html', 'acdf4b9b9e7b644cb0e2289bd134bbee8c89f81b809949d977c0956380baceb4'),
              '2009orlaw0794': ('https://www.oregonlegislature.gov/bills_laws/lawsstatutes/2009orLaw0794.html', '1000140798970441e297fe7978e8e5de4b2cca74412809762ed8e6ec75955867'),
              '2009orlaw0827': ('https://www.oregonlegislature.gov/bills_laws/lawsstatutes/2009orLaw0827.html', '0ed115afa6a142a48c5f4379fbb29736fa3494d95d449fe40fd321abb0d8b5ab'),
              '2009orlaw0863': ('https://www.oregonlegislature.gov/bills_laws/lawsstatutes/2009orLaw0863.html', 'c7823d633fface39ddb43385d072076fc47dfb71855654a43ce44361e8a98914'),
          }

          manifest = json.loads(manifest_path.read_text())
          pending = json.loads(pending_path.read_text())
          docs = manifest['documents']
          existing = {d['id'] for d in docs}
          if len(docs) != 42:
              raise SystemExit(f'Expected 42 existing gold documents, found {len(docs)}')

          promoted = []
          for doc in pending['documents']:
              doc_id = doc['id']
              if doc_id not in hashes:
                  raise SystemExit(f'Unexpected candidate {doc_id}')
              if doc_id in existing:
                  raise SystemExit(f'Candidate already exists in manifest: {doc_id}')
              expected_url, sha = hashes[doc_id]
              if doc['sourceUrl'] != expected_url:
                  raise SystemExit(f'Source URL mismatch for {doc_id}')
              out = dict(doc)
              out['sourceSha256'] = sha
              out['reviewStatus'] = 'independently-reviewed'
              promoted.append(out)

          if {d['id'] for d in promoted} != set(hashes):
              raise SystemExit('Candidate set does not exactly match verified staging report')

          docs.extend(promoted)
          ids = [d['id'] for d in docs]
          if len(ids) != 50 or len(ids) != len(set(ids)):
              raise SystemExit('Post-promotion manifest cardinality/uniqueness check failed')

          manifest['reviewStatus'] = 'release-certification-candidate'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')
          pending_path.unlink()
          workflow_path.unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold/manifest.json gold/pending/pr16-candidates.json .github/workflows/pr16-promote.yml
          git commit -m 'gold: promote verified 2009 final-eight cases'
          git push
