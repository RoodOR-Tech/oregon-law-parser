name: Correct HB3400 reviewed gold expectation

on:
  push:
    branches:
      - hardening/adversarial-gold-batch-7

permissions:
  contents: write

jobs:
  correct-reviewed-expectation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct independently re-reviewed HB 3400 expectation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('gold/manifest.json')
          data = json.loads(path.read_text())
          doc = next(d for d in data['documents'] if d['id'] == '2015orlaw0614')
          amended = doc['expected']['affectedSections']['amended']

          # Oregon Laws 2015 ch. 614 title and operative §§139-142 expressly
          # amend ORS 133.525 and 133.721. ORS 133.521 does not occur in the Act.
          assert '133.521' in amended
          assert '133.525' not in amended
          assert '133.721' not in amended
          amended.remove('133.521')
          amended.extend(['133.525', '133.721'])
          amended.sort(key=lambda s: [int(x) if x.isdigit() else x for x in s.replace('A.', '.A.').split('.')])

          doc['reviewBasis'] = (
              'Independently re-reviewed against Oregon Laws 2015 chapter 614 after a quality-gate discrepancy. '
              'HB 3400 is an 81-page marijuana implementation act whose title enumerates fifty-five unique ORS '
              'amendments, including ORS 133.525 and 133.721, and one ORS repeal, ORS 475.324, alongside extensive '
              'amendments and repeals of chapter 1, Oregon Laws 2015 and other session-law sections. Operative sections '
              '139 and 140 amend ORS 133.525, sections 141 and 142 amend ORS 133.721, and ORS 133.521 does not occur in '
              'the Act. Section 175a expressly repeals ORS 475.324; adjacent sections repeal only sections of the current '
              'or prior Acts. The emergency clause and footer establish the June 30, 2015 effective date.'
          )
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Commit correction
        run: |
          if git diff --quiet -- gold/manifest.json; then
            echo 'No correction needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold/manifest.json
          git commit -m 'Correct independently reviewed HB 3400 gold labels'
          git push origin HEAD:hardening/adversarial-gold-batch-7
